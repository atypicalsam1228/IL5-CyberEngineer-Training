# Starting Loki configuration: local filesystem storage, no object store, retention off.
# Schema v13 from 2024-04-01 is kept because SIEM-2 step 3 reuses the same schema entry.
# SIEM-2 step 3 replaces this with S3 storage (SSE-KMS) and deletion_mode: disabled.
apiVersion: v1
kind: ConfigMap
metadata:
  name: loki-config
  namespace: siem
data:
  config.yaml: |
    auth_enabled: false
    server:
      http_listen_port: 3100
    common:
      path_prefix: /var/loki
      replication_factor: 1
      ring:
        kvstore:
          store: inmemory
    schema_config:
      configs:
        - from: "2024-04-01"
          store: tsdb
          object_store: filesystem
          schema: v13
          index:
            prefix: index_
            period: 24h
    storage_config:
      tsdb_shipper:
        active_index_directory: /var/loki/index
        cache_location: /var/loki/index_cache
      filesystem:
        directory: /var/loki/chunks
    compactor:
      working_directory: /var/loki/compactor
      retention_enabled: false
